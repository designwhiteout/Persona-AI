<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Persona AI</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3147;
    --gold: #f0b429;
    --gold-dim: #c9922a;
    --text: #e8eaf0;
    --text-dim: #7c82a0;
    --accent: #6c7cff;
    --danger: #e05252;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; overflow-x: hidden; }

  /* ── Topbar ── */
  .topbar { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-title { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  .topbar-title span { color: var(--gold); }
  .btn-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); font-size: 18px; }

  /* ── Views ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── Character List ── */
  .char-list { padding: 14px 14px 80px; display: flex; flex-direction: column; gap: 12px; }
  .char-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color .2s; }
  .char-card:active { border-color: var(--gold); }
  .char-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; flex-shrink: 0; }
  .char-avatar.distilled { background: linear-gradient(135deg,#c9922a,#f0b429); color: #000; }
  .char-avatar.raw { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
  .char-info { flex: 1; min-width: 0; }
  .char-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .char-desc { font-size: 13px; color: var(--text-dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .char-badge { margin-top: 6px; display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; }
  .badge-distilled { background: #f0b42922; color: var(--gold); border: 1px solid #f0b42944; }
  .badge-raw { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }

  /* ── Empty state ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 15px; }

  /* ── FAB ── */
  .fab { position: fixed; bottom: 24px; right: 20px; z-index: 99;
    background: var(--gold); color: #000; font-size: 22px; font-weight: 700;
    width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px #f0b42966; }

  /* ── Modal ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: #000a; z-index: 200; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; width: 100%;
    max-height: 90vh; overflow-y: auto; padding: 20px 16px 36px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-title { font-size: 17px; font-weight: 700; }
  .modal-close { background: var(--surface2); border: none; color: var(--text-dim); font-size: 18px;
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }

  /* ── Form ── */
  .form-group { margin-bottom: 16px; }
  label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; display: block; }
  input, textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 15px; padding: 12px; outline: none;
    font-family: var(--font); resize: none; transition: border-color .2s; }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 100px; }
  .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: opacity .2s; }
  .btn:active { opacity: .8; }
  .btn-primary { background: var(--gold); color: #000; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); margin-top: 8px; }
  .btn-danger { background: #e0525222; color: var(--danger); border: 1px solid #e0525244; margin-top: 8px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Detail view ── */
  .detail-header { padding: 16px 16px 0; display: flex; align-items: center; gap: 12px; }
  .detail-avatar { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 22px; font-weight: 700; flex-shrink: 0; }
  .detail-name { font-size: 20px; font-weight: 700; }
  .detail-desc { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
  .back-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; margin-right: 4px; flex-shrink: 0; }

  /* ── Tabs ── */
  .tabs { display: flex; padding: 16px 16px 0; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
    white-space: nowrap; color: var(--text-dim); background: transparent; border: none; transition: all .2s; }
  .tab.active { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

  .tab-content { padding: 16px; padding-bottom: 80px; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ── Cards ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .card-title { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
  .card-body { font-size: 15px; line-height: 1.6; }

  /* ── Trait ── */
  .trait-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .trait-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .trait-name { font-size: 15px; font-weight: 600; }
  .trait-score { font-size: 13px; color: var(--gold); font-weight: 600; }
  .trait-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 8px; }
  .trait-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width .5s; }
  .trait-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  /* ── Quirks chips ── */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
    padding: 4px 10px; font-size: 12px; color: var(--text-dim); }

  /* ── Chat ── */
  .chat-messages { height: calc(100vh - 220px); overflow-y: auto; padding: 0 14px 8px;
    display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .msg { max-width: 82%; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; display: flex; gap: 8px; align-items: flex-end; }
  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: #000;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.55; }
  .msg.user .msg-bubble { background: var(--accent); color: #fff; border-radius: 16px 16px 4px 16px; }
  .msg.assistant .msg-bubble { background: var(--surface2); color: var(--text); border-radius: 4px 16px 16px 16px;
    border: 1px solid var(--border); }
  .chat-input-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
    border-top: 1px solid var(--border); padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: flex-end; }
  .chat-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
    color: var(--text); font-size: 15px; padding: 10px 16px; outline: none; resize: none;
    font-family: var(--font); max-height: 100px; overflow-y: auto; }
  .chat-input:focus { border-color: var(--accent); }
  .chat-send { width: 42px; height: 42px; border-radius: 50%; background: var(--gold); border: none;
    color: #000; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chat-send:disabled { opacity: .4; }
  .chat-toolbar { padding: 8px 14px 0; display: flex; gap: 8px; }
  .chat-tool-btn { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; }

  /* ── Distill action ── */
  .distill-btn { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--gold-dim);
    background: #f0b42911; color: var(--gold); font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; transition: background .2s; }
  .distill-btn:active { background: #f0b42922; }
  .distill-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Embedding ── */
  .embedding-dim { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 32px; font-weight: 700;
    color: var(--gold); text-align: center; padding: 20px 0; }
  .embedding-label { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 20px; }
  .similar-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .similar-name { flex: 1; font-size: 14px; font-weight: 500; }
  .similar-bar-wrap { width: 80px; }
  .similar-bar { height: 4px; background: var(--border); border-radius: 2px; }
  .similar-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .similar-score { font-size: 12px; color: var(--accent); font-weight: 600; min-width: 36px; text-align: right; }

  /* ── Loading / spinner ── */
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid currentColor;
    border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-row { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 14px;
    padding: 20px; justify-content: center; }

  /* ── Toast ── */
  .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 300;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 18px; font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity .3s;
    pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ── View: List ── -->
<div class="view active" id="view-list">
  <div class="topbar">
    <div class="topbar-title">Persona <span>AI</span></div>
    <div style="display:flex;gap:8px">
      <div class="btn-icon" title="导入文件" onclick="openImportModal()">📄</div>
    </div>
  </div>
  <div class="char-list" id="char-list">
    <div class="loading-row"><span class="spinner"></span> 加载中…</div>
  </div>
  <button class="fab" onclick="openCreateModal()">＋</button>
</div>

<!-- ── View: Detail ── -->
<div class="view" id="view-detail">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px;min-width:0">
      <div class="back-btn" onclick="goBack()">←</div>
      <div style="min-width:0">
        <div class="detail-name" id="d-name" style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
      </div>
    </div>
    <div class="btn-icon" onclick="openEditModal()" title="编辑">✏️</div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('overview')">概览</button>
    <button class="tab" onclick="switchTab('traits')">特征</button>
    <button class="tab" onclick="switchTab('embedding')">嵌入</button>
    <button class="tab" onclick="switchTab('chat')">对话</button>
  </div>
  <div class="tab-content">
    <!-- Overview -->
    <div class="tab-pane active" id="tab-overview">
      <button class="distill-btn" id="distill-btn" onclick="distillCharacter()">
        <span id="distill-btn-text">✨ 蒸馏人物</span>
      </button>
      <div class="card" id="overview-desc-card">
        <div class="card-title">描述</div>
        <div class="card-body" id="d-description"></div>
      </div>
      <div class="card" id="overview-bg-card" style="display:none">
        <div class="card-title">背景</div>
        <div class="card-body" id="d-background"></div>
      </div>
      <div class="card" id="overview-prompt-card" style="display:none">
        <div class="card-title">System Prompt</div>
        <div class="card-body" id="d-system-prompt" style="font-size:13px;color:var(--text-dim);white-space:pre-wrap"></div>
      </div>
    </div>
    <!-- Traits -->
    <div class="tab-pane" id="tab-traits">
      <div id="traits-empty" class="empty" style="padding:40px 20px">
        <div class="icon">🧬</div>
        <p>尚未蒸馏，请先在概览页执行蒸馏</p>
      </div>
      <div id="traits-list"></div>
      <div id="speech-card" style="display:none">
        <div class="card">
          <div class="card-title">语言模式</div>
          <div style="margin-bottom:10px"><span style="color:var(--text-dim);font-size:13px">词汇风格</span><div id="sp-vocab" style="margin-top:4px;font-size:14px"></div></div>
          <div style="margin-bottom:10px"><span style="color:var(--text-dim);font-size:13px">句式结构</span><div id="sp-sentence" style="margin-top:4px;font-size:14px"></div></div>
          <div style="margin-bottom:10px"><span style="color:var(--text-dim);font-size:13px">语气</span><div id="sp-tone" style="margin-top:4px;font-size:14px"></div></div>
          <div><span style="color:var(--text-dim);font-size:13px">语言习惯</span><div class="chips" id="sp-quirks"></div></div>
        </div>
      </div>
    </div>
    <!-- Embedding -->
    <div class="tab-pane" id="tab-embedding">
      <div id="embedding-empty" class="empty" style="padding:40px 20px">
        <div class="icon">🔢</div>
        <p>尚未生成嵌入向量</p>
      </div>
      <div id="embedding-info" style="display:none">
        <div class="card" style="text-align:center">
          <div class="embedding-dim" id="emb-dim">—</div>
          <div class="embedding-label">维度向量 · text-embedding-3-large</div>
          <button class="btn btn-secondary" style="width:auto;padding:8px 20px" onclick="reEmbed()">重新生成</button>
        </div>
        <div class="card">
          <div class="card-title">相似人物</div>
          <div id="similar-list"><div class="loading-row"><span class="spinner"></span></div></div>
        </div>
      </div>
    </div>
    <!-- Chat -->
    <div class="tab-pane" id="tab-chat" style="padding:0">
      <div class="chat-toolbar">
        <button class="chat-tool-btn" onclick="newChatSession()">＋ 新对话</button>
        <div id="chat-status" style="font-size:12px;color:var(--text-dim);padding:4px 0;line-height:1"></div>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div style="text-align:center;color:var(--text-dim);font-size:14px;padding:30px 0">
          开始和角色对话吧
        </div>
      </div>
      <div class="chat-input-bar">
        <textarea class="chat-input" id="chat-input" rows="1" placeholder="输入消息…"
          oninput="autoResize(this)" onkeydown="chatKeydown(event)"></textarea>
        <button class="chat-send" id="chat-send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Modal: Create ── -->
<div class="modal-overlay" id="modal-create" onclick="closeModal('modal-create')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">创建人物</div>
      <button class="modal-close" onclick="closeModal('modal-create')">✕</button>
    </div>
    <div class="form-group">
      <label>名字 *</label>
      <input type="text" id="c-name" placeholder="例如：林黛玉">
    </div>
    <div class="form-group">
      <label>描述 *</label>
      <input type="text" id="c-desc" placeholder="一句话描述这个人物">
    </div>
    <div class="form-group">
      <label>背景故事</label>
      <textarea id="c-bg" placeholder="人物的背景、经历、世界观…"></textarea>
    </div>
    <div class="form-group">
      <label>样本文本（人物的原始对话或描写）</label>
      <textarea id="c-samples" placeholder="粘贴人物的对话片段或文学描写，越多越准确…" style="min-height:120px"></textarea>
    </div>
    <button class="btn btn-primary" id="create-btn" onclick="createCharacter()">创建</button>
    <button class="btn btn-secondary" onclick="closeModal('modal-create')">取消</button>
  </div>
</div>

<!-- ── Modal: Import ── -->
<div class="modal-overlay" id="modal-import" onclick="closeModal('modal-import')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">从文件导入</div>
      <button class="modal-close" onclick="closeModal('modal-import')">✕</button>
    </div>
    <div class="form-group">
      <label>人物名字 *</label>
      <input type="text" id="i-name" placeholder="例如：贾宝玉">
    </div>
    <div class="form-group">
      <label>描述</label>
      <input type="text" id="i-desc" placeholder="可选">
    </div>
    <div class="form-group">
      <label>上传文本文件（.txt）</label>
      <input type="file" id="i-file" accept=".txt" style="padding:8px;background:var(--surface2);border-radius:10px">
    </div>
    <button class="btn btn-primary" id="import-btn" onclick="importFile()">导入并蒸馏</button>
    <button class="btn btn-secondary" onclick="closeModal('modal-import')">取消</button>
  </div>
</div>

<!-- ── Modal: Edit ── -->
<div class="modal-overlay" id="modal-edit" onclick="closeModal('modal-edit')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">编辑人物</div>
      <button class="modal-close" onclick="closeModal('modal-edit')">✕</button>
    </div>
    <div class="form-group">
      <label>名字 *</label>
      <input type="text" id="e-name">
    </div>
    <div class="form-group">
      <label>描述 *</label>
      <input type="text" id="e-desc">
    </div>
    <div class="form-group">
      <label>背景故事</label>
      <textarea id="e-bg"></textarea>
    </div>
    <button class="btn btn-primary" id="edit-btn" onclick="saveEdit()">保存</button>
    <button class="btn btn-danger" onclick="deleteCharacter()">删除人物</button>
    <button class="btn btn-secondary" onclick="closeModal('modal-edit')">取消</button>
  </div>
</div>

<script>
const API = (window.API_BASE) || 'http://localhost:8000';
let currentChar = null;
let sessionId = null;
let isStreaming = false;

// ── API helpers ──────────────────────────────────────────────────────────────

async function api(method, path, body) {
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(API + path, opts);
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${r.status}`);
    }
    return r.json();
  } catch (e) {
    toast(e.message, 'error');
    throw e;
  }
}

async function apiForm(path, formData) {
  try {
    const r = await fetch(API + path, { method: 'POST', body: formData });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${r.status}`);
    }
    return r.json();
  } catch (e) {
    toast(e.message, 'error');
    throw e;
  }
}

// ── Toast ────────────────────────────────────────────────────────────────────

let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Navigation ───────────────────────────────────────────────────────────────

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function goBack() {
  currentChar = null;
  sessionId = null;
  showView('list');
  loadList();
}

// ── Modal helpers ─────────────────────────────────────────────────────────────

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function openCreateModal() { openModal('modal-create'); }
function openImportModal() { openModal('modal-import'); }

// ── List ─────────────────────────────────────────────────────────────────────

async function loadList() {
  const el = document.getElementById('char-list');
  el.innerHTML = '<div class="loading-row"><span class="spinner"></span> 加载中…</div>';
  try {
    const chars = await api('GET', '/characters');
    if (!chars.length) {
      el.innerHTML = `<div class="empty"><div class="icon">🎭</div><p>还没有人物，点击右下角 ＋ 创建</p></div>`;
      return;
    }
    el.innerHTML = chars.map(c => {
      const initial = c.name[0].toUpperCase();
      const distilled = !!c.system_prompt;
      return `<div class="char-card" onclick="openDetail('${c.id}')">
        <div class="char-avatar ${distilled ? 'distilled' : 'raw'}">${initial}</div>
        <div class="char-info">
          <div class="char-name">${esc(c.name)}</div>
          <div class="char-desc">${esc(c.description)}</div>
          <span class="char-badge ${distilled ? 'badge-distilled' : 'badge-raw'}">
            ${distilled ? '✨ 已蒸馏' : '⬡ 未蒸馏'}
          </span>
        </div>
      </div>`;
    }).join('');
  } catch (_) {}
}

// ── Create ───────────────────────────────────────────────────────────────────

async function createCharacter() {
  const name = document.getElementById('c-name').value.trim();
  const description = document.getElementById('c-desc').value.trim();
  if (!name || !description) { toast('请填写名字和描述', 'error'); return; }
  const samples = document.getElementById('c-samples').value.trim();
  const btn = document.getElementById('create-btn');
  btn.disabled = true; btn.textContent = '创建中…';
  try {
    await api('POST', '/characters', {
      name, description,
      background: document.getElementById('c-bg').value.trim(),
      sample_texts: samples ? [samples] : [],
    });
    toast('人物已创建', 'success');
    closeModal('modal-create');
    ['c-name','c-desc','c-bg','c-samples'].forEach(id => document.getElementById(id).value = '');
    loadList();
  } finally {
    btn.disabled = false; btn.textContent = '创建';
  }
}

// ── Import ───────────────────────────────────────────────────────────────────

async function importFile() {
  const name = document.getElementById('i-name').value.trim();
  const file = document.getElementById('i-file').files[0];
  if (!name) { toast('请输入名字', 'error'); return; }
  if (!file) { toast('请选择文件', 'error'); return; }
  const btn = document.getElementById('import-btn');
  btn.disabled = true; btn.textContent = '导入中…';
  try {
    const fd = new FormData();
    fd.append('name', name);
    fd.append('description', document.getElementById('i-desc').value.trim() || '');
    fd.append('file', file);
    fd.append('auto_distill', 'true');
    await apiForm('/characters/import-file', fd);
    toast('导入并蒸馏完成', 'success');
    closeModal('modal-import');
    document.getElementById('i-name').value = '';
    document.getElementById('i-desc').value = '';
    document.getElementById('i-file').value = '';
    loadList();
  } finally {
    btn.disabled = false; btn.textContent = '导入并蒸馏';
  }
}

// ── Detail ───────────────────────────────────────────────────────────────────

async function openDetail(id) {
  const char = await api('GET', `/characters/${id}`);
  if (!char) return;
  currentChar = char;
  sessionId = null;

  document.getElementById('d-name').textContent = char.name;
  document.getElementById('d-description').textContent = char.description;
  document.getElementById('d-background').textContent = char.background || '';
  document.getElementById('overview-bg-card').style.display = char.background ? 'block' : 'none';
  document.getElementById('d-system-prompt').textContent = char.system_prompt || '';
  document.getElementById('overview-prompt-card').style.display = char.system_prompt ? 'block' : 'none';

  // Distill button state
  const dBtn = document.getElementById('distill-btn');
  const dText = document.getElementById('distill-btn-text');
  dBtn.disabled = false;
  dText.textContent = char.system_prompt ? '🔄 重新蒸馏' : '✨ 蒸馏人物';

  renderTraits(char);
  renderEmbedding(char);
  renderChat(char);

  // Switch to first tab
  switchTab('overview');
  showView('detail');
}

function renderTraits(char) {
  const list = document.getElementById('traits-list');
  const empty = document.getElementById('traits-empty');
  const speechCard = document.getElementById('speech-card');
  if (!char.traits || !char.traits.length) {
    list.innerHTML = ''; empty.style.display = 'block'; speechCard.style.display = 'none'; return;
  }
  empty.style.display = 'none';
  list.innerHTML = char.traits.map(t => `
    <div class="trait-card">
      <div class="trait-header">
        <div class="trait-name">${esc(t.name)}</div>
        <div class="trait-score">${(t.intensity * 10).toFixed(1)}</div>
      </div>
      <div class="trait-bar"><div class="trait-bar-fill" style="width:${t.intensity * 100}%"></div></div>
      <div class="trait-desc">${esc(t.description)}</div>
    </div>`).join('');

  if (char.speech_pattern) {
    const sp = char.speech_pattern;
    document.getElementById('sp-vocab').textContent = sp.vocabulary_style;
    document.getElementById('sp-sentence').textContent = sp.sentence_structure;
    document.getElementById('sp-tone').textContent = sp.tone;
    const quirksEl = document.getElementById('sp-quirks');
    quirksEl.innerHTML = (sp.quirks || []).map(q => `<span class="chip">${esc(q)}</span>`).join('');
    speechCard.style.display = 'block';
  }
}

function renderEmbedding(char) {
  const empty = document.getElementById('embedding-empty');
  const info = document.getElementById('embedding-info');
  if (!char.embedding) {
    empty.style.display = 'block'; info.style.display = 'none'; return;
  }
  empty.style.display = 'none'; info.style.display = 'block';
  document.getElementById('emb-dim').textContent = char.embedding.length;
  loadSimilar(char.id);
}

async function loadSimilar(id) {
  const el = document.getElementById('similar-list');
  el.innerHTML = '<div class="loading-row"><span class="spinner"></span></div>';
  try {
    const results = await api('GET', `/characters/${id}/similar?top_k=5`);
    if (!results.length) { el.innerHTML = '<div style="color:var(--text-dim);font-size:14px;padding:10px 0">暂无其他人物</div>'; return; }
    el.innerHTML = results.map(r => `
      <div class="similar-item">
        <div class="similar-name">${esc(r.name)}</div>
        <div class="similar-bar-wrap"><div class="similar-bar"><div class="similar-bar-fill" style="width:${r.similarity * 100}%"></div></div></div>
        <div class="similar-score">${(r.similarity * 100).toFixed(0)}%</div>
      </div>`).join('');
  } catch (_) { el.innerHTML = '<div style="color:var(--text-dim);font-size:14px;padding:10px 0">无法加载</div>'; }
}

function renderChat(char) {
  document.getElementById('chat-status').textContent = '';
  document.getElementById('chat-messages').innerHTML =
    `<div style="text-align:center;color:var(--text-dim);font-size:14px;padding:30px 0">
      ${char.system_prompt ? `和 ${esc(char.name)} 开始对话` : '⚠️ 请先蒸馏人物再对话'}
    </div>`;
}

// ── Distill ──────────────────────────────────────────────────────────────────

async function distillCharacter() {
  if (!currentChar) return;
  const btn = document.getElementById('distill-btn');
  const text = document.getElementById('distill-btn-text');
  btn.disabled = true;
  text.innerHTML = '<span class="spinner"></span> 蒸馏中…';
  try {
    const result = await api('POST', `/characters/${currentChar.id}/distill`, {});
    toast('蒸馏完成', 'success');
    const updated = await api('GET', `/characters/${currentChar.id}`);
    currentChar = updated;
    document.getElementById('d-system-prompt').textContent = updated.system_prompt;
    document.getElementById('overview-prompt-card').style.display = 'block';
    text.textContent = '🔄 重新蒸馏';
    renderTraits(updated);
    renderEmbedding(updated);
    renderChat(updated);
  } finally {
    btn.disabled = false;
    if (document.getElementById('distill-btn-text').textContent === '<span class="spinner"></span> 蒸馏中…') {
      document.getElementById('distill-btn-text').textContent = '✨ 蒸馏人物';
    }
  }
}

// ── Re-embed ─────────────────────────────────────────────────────────────────

async function reEmbed() {
  if (!currentChar) return;
  toast('重新生成中…');
  try {
    await api('POST', `/characters/${currentChar.id}/embed`);
    const updated = await api('GET', `/characters/${currentChar.id}`);
    currentChar = updated;
    renderEmbedding(updated);
    toast('嵌入已更新', 'success');
  } catch (_) {}
}

// ── Edit / Delete ─────────────────────────────────────────────────────────────

function openEditModal() {
  if (!currentChar) return;
  document.getElementById('e-name').value = currentChar.name;
  document.getElementById('e-desc').value = currentChar.description;
  document.getElementById('e-bg').value = currentChar.background || '';
  openModal('modal-edit');
}

async function saveEdit() {
  const name = document.getElementById('e-name').value.trim();
  const description = document.getElementById('e-desc').value.trim();
  if (!name || !description) { toast('名字和描述不能为空', 'error'); return; }
  const btn = document.getElementById('edit-btn');
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    const updated = await api('PATCH', `/characters/${currentChar.id}`, {
      name, description, background: document.getElementById('e-bg').value.trim(),
    });
    currentChar = updated;
    document.getElementById('d-name').textContent = updated.name;
    document.getElementById('d-description').textContent = updated.description;
    closeModal('modal-edit');
    toast('已保存', 'success');
  } finally {
    btn.disabled = false; btn.textContent = '保存';
  }
}

async function deleteCharacter() {
  if (!currentChar) return;
  if (!confirm(`确定删除 "${currentChar.name}"？`)) return;
  await api('DELETE', `/characters/${currentChar.id}`);
  toast('已删除', 'success');
  goBack();
}

// ── Chat ─────────────────────────────────────────────────────────────────────

function newChatSession() {
  sessionId = null;
  renderChat(currentChar);
  toast('新对话已开始');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function chatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  if (!currentChar || isStreaming) return;
  if (!currentChar.system_prompt) { toast('请先蒸馏人物', 'error'); return; }
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = ''; input.style.height = 'auto';
  appendMsg('user', text);

  isStreaming = true;
  document.getElementById('chat-send-btn').disabled = true;

  // Create assistant bubble immediately
  const bubbleId = 'bubble-' + Date.now();
  appendMsg('assistant', '', bubbleId);

  try {
    const response = await fetch(`${API}/characters/${currentChar.id}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId, stream: true }),
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const bubble = document.getElementById(bubbleId);

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));
        if (data.chunk) {
          bubble.textContent += data.chunk;
          scrollChat();
        }
        if (data.done) {
          sessionId = data.session_id;
          document.getElementById('chat-status').textContent = `会话 ${sessionId.slice(0, 8)}…`;
        }
      }
    }
  } catch (e) {
    document.getElementById(bubbleId).textContent = '⚠️ 发送失败：' + e.message;
    toast(e.message, 'error');
  } finally {
    isStreaming = false;
    document.getElementById('chat-send-btn').disabled = false;
  }
}

function appendMsg(role, text, id) {
  const msgs = document.getElementById('chat-messages');
  // Clear placeholder
  if (msgs.children.length === 1 && msgs.children[0].style.textAlign === 'center') {
    msgs.innerHTML = '';
  }
  const initial = currentChar ? currentChar.name[0].toUpperCase() : 'A';
  if (role === 'user') {
    msgs.insertAdjacentHTML('beforeend', `
      <div class="msg user"><div class="msg-bubble">${esc(text)}</div></div>`);
  } else {
    msgs.insertAdjacentHTML('beforeend', `
      <div class="msg assistant">
        <div class="msg-avatar">${initial}</div>
        <div class="msg-bubble" ${id ? `id="${id}"` : ''}>${text}</div>
      </div>`);
  }
  scrollChat();
}

function scrollChat() {
  const el = document.getElementById('chat-messages');
  el.scrollTop = el.scrollHeight;
}

// ── Tabs ─────────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const names = ['overview','traits','embedding','chat'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

// ── Utils ─────────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ─────────────────────────────────────────────────────────────────────

loadList();
</script>
