<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3147;
    --gold: #f0b429;
    --accent: #6c7cff;
    --text: #e8eaf0;
    --text-dim: #7c82a0;
    --danger: #ff5c5c;
    --success: #4caf7d;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    overflow: hidden;
  }

  #app {
    display: flex;
    height: 100vh;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #sidebar-header h1 {
    font-size: 16px;
    font-weight: 700;
    flex: 1;
    color: var(--text);
  }

  #btn-settings {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-dim);
    padding: 4px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  #btn-settings:hover { background: var(--surface2); color: var(--text); }

  #sidebar-actions {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }

  .btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: opacity 0.15s, background 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:active { opacity: 0.7; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-gold {
    background: var(--gold);
    color: #1a1000;
    font-weight: 600;
  }

  .btn-danger {
    background: var(--danger);
    color: #fff;
  }

  #char-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  #char-list::-webkit-scrollbar { width: 5px; }
  #char-list::-webkit-scrollbar-track { background: transparent; }
  #char-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .char-card {
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
    border: 1px solid transparent;
  }
  .char-card:hover { background: var(--surface2); }
  .char-card.active {
    background: var(--surface2);
    border-color: var(--accent);
  }

  .char-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    flex-shrink: 0;
    background: var(--surface2);
    color: var(--text-dim);
  }
  .char-avatar.distilled {
    background: linear-gradient(135deg, #f0b429, #e8890c);
    color: #1a1000;
  }

  .char-info { flex: 1; overflow: hidden; }
  .char-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .char-desc {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .char-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-distilled { background: #2a2000; color: var(--gold); border: 1px solid #5a3f00; }
  .badge-undistilled { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }

  /* ── Main area ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    gap: 12px;
  }
  #empty-state .icon { font-size: 52px; }
  #empty-state h2 { font-size: 18px; color: var(--text); }
  #empty-state p { font-size: 13px; text-align: center; max-width: 280px; line-height: 1.6; }

  /* ── Detail view ── */
  #detail-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #detail-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #detail-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }
  #detail-name { font-size: 18px; font-weight: 700; }
  #detail-desc { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .header-actions { margin-left: auto; display: flex; gap: 8px; }

  /* ── Tabs ── */
  #tab-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    background: var(--surface);
  }
  .tab-btn {
    padding: 10px 16px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  #tab-content {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .tab-panel {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 20px;
    display: none;
  }
  .tab-panel.active { display: block; }
  .tab-panel::-webkit-scrollbar { width: 5px; }
  .tab-panel::-webkit-scrollbar-track { background: transparent; }
  .tab-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  /* ── Overview tab ── */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .section-body {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
  }
  pre.section-body {
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bg);
    padding: 12px;
    border-radius: 6px;
    font-family: "SF Mono", "Fira Code", Consolas, monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .distill-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }

  /* ── Traits tab ── */
  .trait-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .trait-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .trait-name { font-size: 13px; font-weight: 600; }
  .trait-intensity {
    font-size: 11px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .intensity-bar {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .intensity-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius: 2px;
    transition: width 0.4s;
  }
  .trait-desc { font-size: 12px; color: var(--text-dim); line-height: 1.6; }

  .speech-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-top: 14px;
  }
  .speech-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .speech-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    width: 72px;
    flex-shrink: 0;
    padding-top: 4px;
  }
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--text);
  }

  /* ── Embedding tab ── */
  .embed-dims {
    font-family: "SF Mono", "Fira Code", Consolas, monospace;
    font-size: 13px;
    background: var(--bg);
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--gold);
    word-break: break-all;
    margin-bottom: 14px;
    max-height: 120px;
    overflow: hidden;
    line-height: 1.5;
  }

  .similar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .similar-row:last-child { border-bottom: none; }
  .similar-name { font-size: 13px; flex: 1; }
  .sim-bar-wrap { width: 100px; }
  .sim-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }
  .sim-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }
  .sim-pct { font-size: 11px; color: var(--text-dim); width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ── Chat tab ── */
  #tab-chat {
    display: none;
    flex-direction: column;
    padding: 0 !important;
  }
  #tab-chat.active { display: flex; }

  #chat-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    flex-shrink: 0;
  }
  #chat-title { font-size: 13px; font-weight: 600; flex: 1; }

  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #chat-messages::-webkit-scrollbar { width: 5px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .msg-row.user .msg-avatar { background: var(--accent); color: #fff; }
  .msg-row.assistant .msg-avatar { background: linear-gradient(135deg, var(--gold), #e8890c); color: #1a1000; }

  .msg-bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.65;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg-row.user .msg-bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-row.assistant .msg-bubble {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  #chat-input-area {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface);
    flex-shrink: 0;
  }

  #chat-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 13px;
    resize: none;
    max-height: 140px;
    min-height: 40px;
    line-height: 1.5;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  #chat-input:focus { border-color: var(--accent); }
  #chat-input::placeholder { color: var(--text-dim); }

  #btn-send {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  #btn-send:hover { opacity: 0.85; }
  #btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

  .thinking-dots span {
    display: inline-block;
    animation: blink 1.2s infinite;
    font-size: 18px;
    line-height: 1;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 460px;
    max-width: 92vw;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    transform: translateY(12px);
    transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .btn-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-dim);
    padding: 2px 6px;
    border-radius: 6px;
  }
  .btn-close:hover { background: var(--surface2); color: var(--text); }

  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 80px; }

  .warning-banner {
    background: #2a1a00;
    border: 1px solid #5a3500;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text);
    z-index: 2000;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    max-width: 320px;
  }
  #toast.show { opacity: 1; transform: translateY(0); pointer-events: all; }
  #toast.error { border-color: var(--danger); color: var(--danger); }
  #toast.success { border-color: var(--success); color: var(--success); }

  /* ── Loading spinner ── */
  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-hint {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
    font-size: 13px;
    line-height: 1.8;
  }
  .empty-hint .icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>✨ Persona AI</h1>
      <button id="btn-settings" title="设置">⚙️</button>
    </div>
    <div id="sidebar-actions">
      <button class="btn btn-primary" id="btn-new-char">＋ 新建人物</button>
      <button class="btn btn-secondary" id="btn-import-file">📂 导入文件</button>
    </div>
    <div id="char-list"></div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="empty-state">
      <div class="icon">🎭</div>
      <h2>Persona AI</h2>
      <p>从侧栏选择或新建一个人物角色，<br>开始蒸馏与对话体验。</p>
    </div>

    <div id="detail-view" style="display:none">
      <div id="detail-header">
        <div id="detail-avatar" class="char-avatar"></div>
        <div>
          <div id="detail-name"></div>
          <div id="detail-desc"></div>
        </div>
        <div class="header-actions">
          <button class="btn btn-secondary" id="btn-edit-char" style="font-size:12px">编辑</button>
          <button class="btn btn-danger" id="btn-delete-char" style="font-size:12px">删除</button>
        </div>
      </div>

      <div id="tab-bar">
        <button class="tab-btn active" data-tab="overview">概览</button>
        <button class="tab-btn" data-tab="traits">特征</button>
        <button class="tab-btn" data-tab="embedding">嵌入</button>
        <button class="tab-btn" data-tab="chat">对话</button>
      </div>

      <div id="tab-content">
        <!-- Overview -->
        <div class="tab-panel active" id="tab-overview">
          <div class="distill-bar">
            <button class="btn btn-gold" id="btn-distill">✨ 蒸馏人物</button>
            <span id="distill-status" style="font-size:12px;color:var(--text-dim)"></span>
          </div>
          <div class="section">
            <div class="section-title">描述</div>
            <div class="section-body" id="ov-description">—</div>
          </div>
          <div class="section">
            <div class="section-title">背景</div>
            <div class="section-body" id="ov-background">—</div>
          </div>
          <div class="section">
            <div class="section-title">系统提示词</div>
            <pre class="section-body" id="ov-system-prompt">尚未蒸馏</pre>
          </div>
        </div>

        <!-- Traits -->
        <div class="tab-panel" id="tab-traits">
          <div id="traits-container"></div>
          <div id="speech-container"></div>
        </div>

        <!-- Embedding -->
        <div class="tab-panel" id="tab-embedding">
          <div id="embed-container"></div>
        </div>

        <!-- Chat -->
        <div class="tab-panel" id="tab-chat">
          <div id="chat-header">
            <span id="chat-title">对话</span>
            <button class="btn btn-secondary" id="btn-new-session" style="font-size:12px;padding:5px 10px">新对话</button>
          </div>
          <div id="chat-messages"></div>
          <div id="chat-input-area">
            <textarea id="chat-input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
            <button id="btn-send">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- New / Edit Character Modal -->
<div class="modal-overlay" id="modal-char">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-char-title">新建人物</span>
      <button class="btn-close" data-close="modal-char">✕</button>
    </div>
    <div class="form-group">
      <label>名称 *</label>
      <input type="text" id="char-name" placeholder="人物名称">
    </div>
    <div class="form-group">
      <label>描述</label>
      <input type="text" id="char-desc-input" placeholder="简短描述">
    </div>
    <div class="form-group">
      <label>背景故事</label>
      <textarea id="char-bg" placeholder="角色背景、历史…" style="min-height:100px"></textarea>
    </div>
    <div class="form-group">
      <label>样本文本（可选，每段用空行分隔）</label>
      <textarea id="char-samples" placeholder="粘贴该角色的对话/独白文本…" style="min-height:120px"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close="modal-char">取消</button>
      <button class="btn btn-primary" id="btn-save-char">保存</button>
    </div>
  </div>
</div>

<!-- Import File Modal -->
<div class="modal-overlay" id="modal-import">
  <div class="modal">
    <div class="modal-title">
      <span>导入文件</span>
      <button class="btn-close" data-close="modal-import">✕</button>
    </div>
    <div class="form-group">
      <label>人物名称 *</label>
      <input type="text" id="import-name" placeholder="人物名称">
    </div>
    <div class="form-group">
      <label>描述（可选）</label>
      <input type="text" id="import-desc" placeholder="简短描述">
    </div>
    <div class="form-group">
      <label>选择文本文件 *</label>
      <input type="file" id="import-file" accept=".txt,.md,.json" style="cursor:pointer">
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="import-distill" checked style="width:auto">
      <label style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;font-weight:normal">自动蒸馏</label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close="modal-import">取消</button>
      <button class="btn btn-primary" id="btn-do-import">导入</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modal-settings">
  <div class="modal">
    <div class="modal-title">
      <span>⚙️ 设置</span>
      <button class="btn-close" data-close="modal-settings">✕</button>
    </div>
    <div id="api-key-warning" class="warning-banner" style="display:none">
      ⚠️ 未配置 API Key，请填写后保存。
    </div>
    <div class="form-group">
      <label>OpenAI API Key</label>
      <input type="password" id="cfg-api-key" placeholder="sk-...">
    </div>
    <div class="form-group">
      <label>Base URL</label>
      <input type="text" id="cfg-base-url" placeholder="https://api.openai.com/v1">
    </div>
    <div class="form-group">
      <label>对话模型 (chat_model)</label>
      <input type="text" id="cfg-chat-model" placeholder="gpt-4o">
    </div>
    <div class="form-group">
      <label>嵌入模型 (embedding_model)</label>
      <input type="text" id="cfg-embed-model" placeholder="text-embedding-3-small">
    </div>
    <div class="form-group">
      <label>蒸馏模型 (distill_model)</label>
      <input type="text" id="cfg-distill-model" placeholder="gpt-4o">
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close="modal-settings">取消</button>
      <button class="btn btn-primary" id="btn-save-settings">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
const state = {
  characters: [],
  activeId: null,
  activeChar: null,
  sessionId: null,
  editingId: null,
  chatStreaming: false,
};

// ── API helpers ────────────────────────────────────────────────────────────────
async function api(method, path, body, isForm) {
  const opts = { method, headers: {} };
  if (body && !isForm) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  } else if (isForm) {
    opts.body = body; // FormData
  }
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg;
    try { msg = (await r.json()).detail || r.statusText; } catch { msg = r.statusText; }
    throw new Error(msg);
  }
  if (r.status === 204) return null;
  return r.json();
}

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3200);
}

// ── Modal helpers ──────────────────────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});
document.querySelectorAll('.modal-overlay').forEach(ov => {
  ov.addEventListener('click', e => {
    if (e.target === ov) closeModal(ov.id);
  });
});

// ── Character list ─────────────────────────────────────────────────────────────
async function loadCharacters() {
  try {
    state.characters = await api('GET', '/characters');
    renderCharList();
  } catch (e) {
    showToast('加载人物列表失败: ' + e.message, 'error');
  }
}

function renderCharList() {
  const list = document.getElementById('char-list');
  list.innerHTML = '';
  if (!state.characters.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:12px">暂无人物，点击"新建人物"开始</div>';
    return;
  }
  state.characters.forEach(c => {
    const card = document.createElement('div');
    card.className = 'char-card' + (c.id === state.activeId ? ' active' : '');
    card.dataset.id = c.id;
    const initial = (c.name || '?')[0].toUpperCase();
    const distilled = !!c.system_prompt;
    card.innerHTML = `
      <div class="char-avatar ${distilled ? 'distilled' : ''}">${initial}</div>
      <div class="char-info">
        <div class="char-name">${esc(c.name)}</div>
        <div class="char-desc">${esc(c.description || '')}</div>
      </div>
      <span class="char-badge ${distilled ? 'badge-distilled' : 'badge-undistilled'}">${distilled ? '已蒸馏' : '未蒸馏'}</span>
    `;
    card.addEventListener('click', () => selectChar(c.id));
    list.appendChild(card);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Select character ───────────────────────────────────────────────────────────
async function selectChar(id) {
  state.activeId = id;
  state.sessionId = null;
  document.querySelectorAll('.char-card').forEach(c => c.classList.toggle('active', c.dataset.id === id));
  try {
    state.activeChar = await api('GET', `/characters/${id}`);
    renderDetail(state.activeChar);
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('detail-view').style.display = 'flex';
    document.getElementById('detail-view').style.flexDirection = 'column';
  } catch (e) {
    showToast('加载人物失败: ' + e.message, 'error');
  }
}

function renderDetail(c) {
  const initial = (c.name || '?')[0].toUpperCase();
  const distilled = !!c.system_prompt;

  const avatar = document.getElementById('detail-avatar');
  avatar.textContent = initial;
  avatar.className = 'char-avatar' + (distilled ? ' distilled' : '');

  document.getElementById('detail-name').textContent = c.name;
  document.getElementById('detail-desc').textContent = c.description || '';

  // Overview
  document.getElementById('ov-description').textContent = c.description || '—';
  document.getElementById('ov-background').textContent = c.background || '—';
  document.getElementById('ov-system-prompt').textContent = c.system_prompt || '尚未蒸馏';

  const btn = document.getElementById('btn-distill');
  btn.textContent = distilled ? '🔄 重新蒸馏' : '✨ 蒸馏人物';
  document.getElementById('distill-status').textContent = distilled ? '已蒸馏 ✓' : '';

  // Traits
  renderTraits(c);

  // Embedding
  renderEmbedding(c);

  // Chat - reset
  document.getElementById('chat-messages').innerHTML = '';
  document.getElementById('chat-title').textContent = `与 ${c.name} 对话`;
}

// ── Traits ─────────────────────────────────────────────────────────────────────
function renderTraits(c) {
  const tc = document.getElementById('traits-container');
  const sc = document.getElementById('speech-container');
  tc.innerHTML = '';
  sc.innerHTML = '';

  if (!c.traits || !c.traits.length) {
    tc.innerHTML = `<div class="empty-hint"><div class="icon">🧩</div>暂无特征数据<br><small>请先进行蒸馏</small></div>`;
    return;
  }

  c.traits.forEach(t => {
    const card = document.createElement('div');
    card.className = 'trait-card';
    const pct = Math.round((t.intensity || 0) * 100);
    card.innerHTML = `
      <div class="trait-header">
        <span class="trait-name">${esc(t.name)}</span>
        <span class="trait-intensity">${pct}%</span>
      </div>
      <div class="intensity-bar"><div class="intensity-fill" style="width:${pct}%"></div></div>
      <div class="trait-desc">${esc(t.description || '')}</div>
    `;
    tc.appendChild(card);
  });

  if (c.speech_pattern) {
    const sp = c.speech_pattern;
    const rows = [
      ['词汇', sp.vocabulary_level],
      ['句式', sp.sentence_structure],
      ['语气', sp.tone],
      ['习惯', sp.quirks],
    ];
    let rowsHtml = rows.map(([label, val]) => {
      if (!val) return '';
      const items = Array.isArray(val) ? val : [val];
      const chips = items.map(v => `<span class="chip">${esc(v)}</span>`).join('');
      return `<div class="speech-row"><span class="speech-label">${label}</span><div class="chip-list">${chips}</div></div>`;
    }).join('');

    sc.innerHTML = `<div class="speech-card"><div class="section-title">言语风格</div>${rowsHtml}</div>`;
  }
}

// ── Embedding ──────────────────────────────────────────────────────────────────
function renderEmbedding(c) {
  const ec = document.getElementById('embed-container');
  ec.innerHTML = '';

  if (!c.embedding || !c.embedding.length) {
    ec.innerHTML = `<div class="empty-hint"><div class="icon">🔢</div>暂无嵌入向量<br><small>请先蒸馏，嵌入将自动生成</small></div>`;
    // Add regen button
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary';
    btn.textContent = '生成嵌入';
    btn.style.marginTop = '12px';
    btn.addEventListener('click', () => generateEmbedding());
    ec.appendChild(btn);
    return;
  }

  const dims = c.embedding.length;
  const preview = c.embedding.slice(0, 16).map(v => v.toFixed(4)).join(', ') + ' …';

  const regenBtn = document.createElement('button');
  regenBtn.className = 'btn btn-secondary';
  regenBtn.textContent = '重新生成';
  regenBtn.style.marginBottom = '12px';
  regenBtn.addEventListener('click', () => generateEmbedding());

  ec.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-size:13px;color:var(--text-dim)">维度: <strong style="color:var(--text)">${dims}</strong></span>
    </div>
    <div class="embed-dims">[${preview}]</div>
  `;
  ec.appendChild(regenBtn);

  // Similar characters section
  const simSect = document.createElement('div');
  simSect.className = 'section';
  simSect.innerHTML = '<div class="section-title">相似人物</div><div id="similar-list"><span class="spinner"></span></div>';
  ec.appendChild(simSect);

  loadSimilar(c.id);
}

async function generateEmbedding() {
  if (!state.activeId) return;
  try {
    showToast('生成嵌入中…');
    const r = await api('POST', `/characters/${state.activeId}/embed`);
    state.activeChar.embedding = r.embedding;
    state.activeChar.embedding_metadata = r.metadata;
    renderEmbedding(state.activeChar);
    showToast('嵌入生成成功', 'success');
  } catch (e) {
    showToast('嵌入失败: ' + e.message, 'error');
  }
}

async function loadSimilar(charId) {
  const el = document.getElementById('similar-list');
  if (!el) return;
  try {
    const results = await api('GET', `/characters/${charId}/similar?top_k=5`);
    if (!results.length) {
      el.innerHTML = '<div style="color:var(--text-dim);font-size:12px">暂无其他人物可对比</div>';
      return;
    }
    el.innerHTML = results.map(r => {
      const pct = Math.round(r.similarity * 100);
      return `
        <div class="similar-row">
          <span class="similar-name">${esc(r.name)}</span>
          <div class="sim-bar-wrap"><div class="sim-bar"><div class="sim-fill" style="width:${pct}%"></div></div></div>
          <span class="sim-pct">${pct}%</span>
        </div>`;
    }).join('');
  } catch {
    el.innerHTML = '<div style="color:var(--text-dim);font-size:12px">加载失败</div>';
  }
}

// ── Tabs ───────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── Distill ────────────────────────────────────────────────────────────────────
document.getElementById('btn-distill').addEventListener('click', async () => {
  if (!state.activeId) return;
  const btn = document.getElementById('btn-distill');
  const status = document.getElementById('distill-status');
  btn.disabled = true;
  btn.textContent = '蒸馏中…';
  status.textContent = '';
  try {
    const r = await api('POST', `/characters/${state.activeId}/distill`, {});
    state.activeChar.traits = r.traits;
    state.activeChar.speech_pattern = r.speech_pattern;
    state.activeChar.system_prompt = r.system_prompt;
    // Reload full char
    state.activeChar = await api('GET', `/characters/${state.activeId}`);
    renderDetail(state.activeChar);
    await loadCharacters();
    showToast('蒸馏完成！', 'success');
  } catch (e) {
    showToast('蒸馏失败: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '✨ 蒸馏人物';
  }
});

// ── New character ──────────────────────────────────────────────────────────────
document.getElementById('btn-new-char').addEventListener('click', () => {
  state.editingId = null;
  document.getElementById('modal-char-title').textContent = '新建人物';
  document.getElementById('char-name').value = '';
  document.getElementById('char-desc-input').value = '';
  document.getElementById('char-bg').value = '';
  document.getElementById('char-samples').value = '';
  openModal('modal-char');
});

document.getElementById('btn-save-char').addEventListener('click', async () => {
  const name = document.getElementById('char-name').value.trim();
  if (!name) { showToast('请输入名称', 'error'); return; }
  const samplesRaw = document.getElementById('char-samples').value.trim();
  const samples = samplesRaw ? samplesRaw.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean) : [];
  const body = {
    name,
    description: document.getElementById('char-desc-input').value.trim(),
    background: document.getElementById('char-bg').value.trim(),
    sample_texts: samples,
  };
  try {
    if (state.editingId) {
      await api('PATCH', `/characters/${state.editingId}`, body);
    } else {
      await api('POST', '/characters', body);
    }
    closeModal('modal-char');
    await loadCharacters();
    showToast(state.editingId ? '已更新' : '人物已创建', 'success');
  } catch (e) {
    showToast('保存失败: ' + e.message, 'error');
  }
});

// ── Edit character ─────────────────────────────────────────────────────────────
document.getElementById('btn-edit-char').addEventListener('click', () => {
  if (!state.activeChar) return;
  state.editingId = state.activeChar.id;
  document.getElementById('modal-char-title').textContent = '编辑人物';
  document.getElementById('char-name').value = state.activeChar.name || '';
  document.getElementById('char-desc-input').value = state.activeChar.description || '';
  document.getElementById('char-bg').value = state.activeChar.background || '';
  document.getElementById('char-samples').value = (state.activeChar.sample_texts || []).join('\n\n');
  openModal('modal-char');
});

// ── Delete character ───────────────────────────────────────────────────────────
document.getElementById('btn-delete-char').addEventListener('click', async () => {
  if (!state.activeId) return;
  if (!confirm(`确定要删除"${state.activeChar.name}"吗？`)) return;
  try {
    await api('DELETE', `/characters/${state.activeId}`);
    state.activeId = null;
    state.activeChar = null;
    document.getElementById('detail-view').style.display = 'none';
    document.getElementById('empty-state').style.display = 'flex';
    await loadCharacters();
    showToast('已删除', 'success');
  } catch (e) {
    showToast('删除失败: ' + e.message, 'error');
  }
});

// ── Import file ────────────────────────────────────────────────────────────────
document.getElementById('btn-import-file').addEventListener('click', () => {
  document.getElementById('import-name').value = '';
  document.getElementById('import-desc').value = '';
  document.getElementById('import-file').value = '';
  document.getElementById('import-distill').checked = true;
  openModal('modal-import');
});

document.getElementById('btn-do-import').addEventListener('click', async () => {
  const name = document.getElementById('import-name').value.trim();
  const fileEl = document.getElementById('import-file');
  if (!name) { showToast('请输入名称', 'error'); return; }
  if (!fileEl.files.length) { showToast('请选择文件', 'error'); return; }
  const fd = new FormData();
  fd.append('name', name);
  fd.append('description', document.getElementById('import-desc').value.trim());
  fd.append('file', fileEl.files[0]);
  fd.append('auto_distill', document.getElementById('import-distill').checked ? 'true' : 'false');
  try {
    const btn = document.getElementById('btn-do-import');
    btn.disabled = true;
    btn.textContent = '导入中…';
    const c = await api('POST', '/characters/import-file', fd, true);
    closeModal('modal-import');
    await loadCharacters();
    await selectChar(c.id);
    showToast('导入完成！', 'success');
  } catch (e) {
    showToast('导入失败: ' + e.message, 'error');
  } finally {
    const btn = document.getElementById('btn-do-import');
    btn.disabled = false;
    btn.textContent = '导入';
  }
});

// ── Settings ───────────────────────────────────────────────────────────────────
document.getElementById('btn-settings').addEventListener('click', async () => {
  try {
    const cfg = await api('GET', '/api/config');
    document.getElementById('api-key-warning').style.display = cfg.api_key_set ? 'none' : 'block';
    document.getElementById('cfg-api-key').value = '';
    document.getElementById('cfg-base-url').value = cfg.base_url || '';
    document.getElementById('cfg-chat-model').value = cfg.chat_model || '';
    document.getElementById('cfg-embed-model').value = cfg.embedding_model || '';
    document.getElementById('cfg-distill-model').value = cfg.distill_model || '';
    openModal('modal-settings');
  } catch (e) {
    showToast('加载配置失败: ' + e.message, 'error');
  }
});

document.getElementById('btn-save-settings').addEventListener('click', async () => {
  const body = {};
  const key = document.getElementById('cfg-api-key').value.trim();
  if (key) body.openai_api_key = key;
  const base = document.getElementById('cfg-base-url').value.trim();
  if (base) body.openai_base_url = base;
  const chat = document.getElementById('cfg-chat-model').value.trim();
  if (chat) body.chat_model = chat;
  const emb = document.getElementById('cfg-embed-model').value.trim();
  if (emb) body.embedding_model = emb;
  const dist = document.getElementById('cfg-distill-model').value.trim();
  if (dist) body.distill_model = dist;

  if (!Object.keys(body).length) { closeModal('modal-settings'); return; }
  try {
    await api('POST', '/api/config', body);
    closeModal('modal-settings');
    showToast('设置已保存', 'success');
  } catch (e) {
    showToast('保存失败: ' + e.message, 'error');
  }
});

// ── Chat ───────────────────────────────────────────────────────────────────────
document.getElementById('btn-new-session').addEventListener('click', () => {
  state.sessionId = null;
  document.getElementById('chat-messages').innerHTML = '';
  showToast('新对话已开始');
});

const chatInput = document.getElementById('chat-input');
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
});
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById('btn-send').addEventListener('click', sendMessage);

function appendMessage(role, content) {
  const msgs = document.getElementById('chat-messages');
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const initial = role === 'user' ? 'U' : (state.activeChar ? state.activeChar.name[0].toUpperCase() : 'A');
  row.innerHTML = `
    <div class="msg-avatar">${initial}</div>
    <div class="msg-bubble">${esc(content)}</div>
  `;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return row.querySelector('.msg-bubble');
}

function appendThinking() {
  const msgs = document.getElementById('chat-messages');
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.id = 'thinking-row';
  const initial = state.activeChar ? state.activeChar.name[0].toUpperCase() : 'A';
  row.innerHTML = `
    <div class="msg-avatar">${initial}</div>
    <div class="msg-bubble thinking-dots"><span>•</span><span>•</span><span>•</span></div>
  `;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return row;
}

async function sendMessage() {
  if (state.chatStreaming) return;
  if (!state.activeChar) { showToast('请先选择人物', 'error'); return; }
  if (!state.activeChar.system_prompt) { showToast('请先蒸馏人物再对话', 'error'); return; }

  const msg = chatInput.value.trim();
  if (!msg) return;

  chatInput.value = '';
  chatInput.style.height = 'auto';
  document.getElementById('btn-send').disabled = true;
  state.chatStreaming = true;

  appendMessage('user', msg);
  const thinkRow = appendThinking();

  try {
    const resp = await fetch(`/characters/${state.activeChar.id}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: state.sessionId, stream: true }),
    });

    if (!resp.ok) {
      let detail;
      try { detail = (await resp.json()).detail; } catch { detail = resp.statusText; }
      throw new Error(detail);
    }

    // Replace thinking dots with streaming bubble
    thinkRow.remove();
    const bubble = appendMessage('assistant', '');
    let fullText = '';

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const obj = JSON.parse(line.slice(6));
          if (obj.chunk) {
            fullText += obj.chunk;
            bubble.textContent = fullText;
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
          }
          if (obj.done && obj.session_id) {
            state.sessionId = obj.session_id;
          }
        } catch {}
      }
    }
  } catch (e) {
    thinkRow.remove();
    showToast('发送失败: ' + e.message, 'error');
  } finally {
    state.chatStreaming = false;
    document.getElementById('btn-send').disabled = false;
  }
}

// ── Init ───────────────────────────────────────────────────────────────────────
async function init() {
  await loadCharacters();
  // Check API key
  try {
    const cfg = await api('GET', '/api/config');
    if (!cfg.api_key_set) {
      showToast('⚠️ 请先配置 API Key（点击设置图标）', 'error');
    }
  } catch {}
}

init();
</script>
